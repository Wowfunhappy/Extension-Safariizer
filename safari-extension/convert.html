<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Extension Safariizer</title>
  <style>
    body {
      margin: 0;
      font: 14px/1.45 -apple-system-font, "Helvetica Neue", Helvetica, sans-serif;
      color: #222;
      background: #f4f5f7;
    }
    main {
      max-width: 560px;
      margin: 72px auto;
      padding: 28px 32px;
      background: #fff;
      border: 1px solid #dcdfe4;
      border-radius: 10px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 600;
    }
    #address {
      margin: 0 0 20px;
      color: #666;
      word-break: break-all;
    }
    #status {
      margin: 0;
      font-size: 15px;
    }
    #detail {
      margin: 6px 0 0;
      color: #666;
    }
    progress {
      display: block;
      width: 100%;
      margin: 14px 0 0;
    }
    button {
      margin: 18px 0 0;
      font: inherit;
    }
    .failed #status {
      color: #b3261e;
    }
    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>Extension Safariizer</h1>
    <p id="address"></p>
    <p id="status">Starting…</p>
    <p id="detail" hidden></p>
    <progress id="progress" max="1"></progress>
    <button id="again" type="button" hidden>Try again</button>
  </main>
  <script src="convert.js"></script>
</body>
</html>
